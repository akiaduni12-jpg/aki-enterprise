
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0b1e24"/>
      <stop offset="100%" stop-color="#050e12"/>
    </linearGradient>

    <!-- Outer Emerald Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#005c4b"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="#00a884" stroke-width="1.5" opacity="0.3"/>

  <!-- Center Shield Base -->
  <g filter="url(#shadow)">
    <!-- Security & Command Shield -->
    <path d="M256 70 L380 125 C380 250 330 340 256 390 C182 340 132 250 132 125 Z" fill="url(#shieldGrad)" stroke="url(#glowGrad)" stroke-width="4"/>
    
    <!-- Shield Highlight -->
    <path d="M256 80 L365 130 C365 240 322 325 256 372 Z" fill="#ffffff" opacity="0.08"/>
  </g>

  <!-- Central WhatsApp Speech Bubble Symbol -->
  <g filter="url(#shadow)" transform="translate(196, 145) scale(1.15)">
    <!-- WhatsApp Bubble -->
    <circle cx="52" cy="52" r="48" fill="#25D366"/>
    <path d="M22 82 L26 66 C21 58 20 48 23 40 C28 28 40 20 54 20 C68 20 80 28 85 40 C90 52 87 66 77 74 C69 81 58 84 48 83 Z" fill="#25D366"/>
    
    <!-- WhatsApp Phone Receiver Icon in crisp white -->
    <path d="M40 34 C38 34 36 35 34 38 C32 42 34 49 39 56 C44 63 51 68 57 70 C61 71 65 69 67 66 L70 61 C71 59 70 58 68 57 L61 54 C60 53 58 54 57 55 L55 57 C50 54 46 50 43 45 L45 43 C46 42 47 40 46 39 L43 32 C42 30 41 30 40 34 Z" fill="#ffffff"/>
  </g>

  <!-- Key / Crown Admin Badge Over Shield -->
  <g transform="translate(256, 310)" filter="url(#shadow)">
    <!-- Badge Pill -->
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#071318" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Star on left and right -->
    <circle cx="-62" cy="0" r="3.5" fill="#FBBF24"/>
    <circle cx="62" cy="0" r="3.5" fill="#FBBF24"/>

    <!-- Text: ADMIN -->
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">ADMIN</text>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#00a884" letter-spacing="2" text-anchor="middle">
    AKI <tspan fill="#ffffff">ENTERPRISE</tspan>
  </text>
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF" letter-spacing="3" text-anchor="middle">
    CONTROL CENTER &amp; WHATSAPP
  </text>
</svg>
