<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A24" />
      <stop offset="100%" stop-color="#F26A00" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255, 138, 36, 0.3)" stroke-width="4" />

  <!-- Glowing Orange Bag Badge -->
  <g transform="translate(106, 86)">
    <!-- Ambient Glow Circle -->
    <circle cx="150" cy="170" r="160" fill="#F26A00" opacity="0.25" filter="url(#glow)" />

    <!-- Shopping Bag Body -->
    <path d="M 50 110 L 250 110 C 275 110, 285 130, 280 155 L 255 310 C 250 335, 235 345, 210 345 L 90 345 C 65 345, 50 335, 45 310 L 20 155 C 15 130, 25 110, 50 110 Z" fill="url(#brandGrad)" />

    <!-- Shopping Bag Handle -->
    <path d="M 100 110 C 100 45, 200 45, 200 110" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" />

    <!-- Central TechHub Bear/Heart Brand Mark -->
    <circle cx="150" cy="225" r="42" fill="#FFFFFF" opacity="0.95" />
    <circle cx="132" cy="215" r="8" fill="#F26A00" />
    <circle cx="168" cy="215" r="8" fill="#F26A00" />
    <path d="M 142 235 Q 150 245 158 235" fill="none" stroke="#F26A00" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Text Lockup -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TECHHUB</text>
</svg>
